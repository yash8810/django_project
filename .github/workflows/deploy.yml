name: Deploy Django App
 
on:
  push:
    branches:
      - fitfusionai   # change if your branch is different
 
jobs:
  deploy:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
 
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}
 
      - name: Copy project to VPS
        run: |
          ssh -o StrictHostKeyChecking=no root@69.62.78.167 "mkdir -p ~/django_app"
          rsync -avz --exclude '.git' ./ root@69.62.78.167:~/django_app/
 
      - name: Create .env file on VPS
        run: |
          ssh root@69.62.78.167 "cat > ~/django_app/.env" <<EOF
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          DB_HOST=${{ secrets.DB_HOST }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_PORT=${{ secrets.DB_PORT }}
          DB_USER=${{ secrets.DB_USER }}
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          STRIPE_PUBLIC_KEY=${{ secrets.STRIPE_PUBLIC_KEY }}
          STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRECT=${{ secrets.STRIPE_WEBHOOK_SECRECT }}
          EOF
 
      - name: Build Docker image on VPS
        run: |
          ssh root@69.62.78.167 "cd ~/django_app && docker build -t django_app ."
 
      - name: Stop and remove old container
        run: |
          ssh root@69.62.78.167 "docker stop django_app || true && docker rm django_app || true"
 
      - name: Run new container
        run: |
          ssh root@69.62.78.167 "docker run -d \
            --name django_app \
            --env-file ~/django_app/.env \
            -p 8000:8000 \
            django_app"
 
      - name: Run migrations
        run: |
          ssh root@69.62.78.167 "docker exec django_app python manage.py migrate --noinput"
