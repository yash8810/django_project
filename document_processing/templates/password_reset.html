{% extends 'base.html' %}
{% load static %}

{% block title %}Password Reset - Document Intelligence{% endblock %}

{% block content %}
<div class="form-container">
    <div class="form-box password-reset-box">
        <div class="form-header">
            <h2>Password Reset</h2>
        </div>
        <form method="POST" class="animated-form">
            {% csrf_token %}
            <div class="form-group">
                <input type="email" id="email" name="email" required>
                <label for="email">Email Address</label>
                <div class="bar"></div>
            </div>
            <div class="form-footer">
                <button type="submit" class="btn-submit">Send Reset Link</button>
                <p class="form-link">Remembered your password? <a href="{% url 'login' %}">Login here</a></p>
            </div>
        </form>
    </div>
</div>
{% endblock %}
